services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: salvagescout
      POSTGRES_PASSWORD: salvagescout
      POSTGRES_DB: salvagescout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salvagescout"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://salvagescout:salvagescout@db:5432/salvagescout
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - images_data:/app/data
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://salvagescout:salvagescout@db:5432/salvagescout
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - images_data:/app/data
    command: ["python", "-m", "app.scheduler"]

volumes:
  postgres_data:
  images_data:
